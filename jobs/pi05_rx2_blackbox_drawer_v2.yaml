config_version: 1

# openpi-0.5 full-parameter fine-tune on rx2_blackbox / drawer-medicine-pickup, larger take.
# 63 episodes / ~54k frames — the real training run (v1 was 1 ep / 914 frames pipeline check).
# 8-GPU single-node JAX FSDP → task type `shell`.
#
# Dataset (aliyun-h100 NAS only):
#   /data/nas_ray/dataset/foundation_data/processed/lerobot/rx2_blackbox/
#     20260902_014345_抽屉取药-抽屉一层黑色药盒-9号/mondoRX-03_task_0016_..._lerobot-f3a05a7f-.../
# schema: rx_p2_29dof (state/action = 29-D body + 2 grippers = 31-D total).

cluster: aliyun_h100
num_gpus: 8
image: ai-base:starvla-cuda12.8_devel-ubuntu22.04-v5

experiment_name: "pi05-rx2-blackbox-drawer-v2"

shared_workspace: /data/nas_ray/home/siyu.luo/project/openpi-0_5
log_folder: "logs"

os_env_vars:
  WANDB_MODE: online

tasks:
  - name: "pi05-rx2-drawer-medicine-v2"
    type: "shell"
    cmd: >
      set -euxo pipefail &&
      cd /data/nas_ray/home/siyu.luo/project/openpi-0_5 &&
      (command -v ffmpeg || (apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg)) &&
      export PATH=$HOME/.local/bin:$PATH &&
      (command -v uv || pip install --user uv) &&
      git config --global url."https://gh-proxy.com/https://github.com/".insteadOf https://github.com/ &&
      export UV_LINK_MODE=copy &&
      GIT_LFS_SKIP_SMUDGE=1 uv sync &&
      GIT_LFS_SKIP_SMUDGE=1 uv pip install -e . &&
      uv pip install gsutil &&
      export WANDB_API_KEY=$(cat /data/nas_ray/home/siyu.luo/.wandb-key) &&
      export HF_LEROBOT_HOME='/data/nas_ray/dataset/foundation_data/processed/lerobot/rx2_blackbox/20260902_014345_抽屉取药-抽屉一层黑色药盒-9号' &&
      export OPENPI_DATA_HOME=/data/nas_ray/home/siyu.luo/cache/openpi &&
      export XLA_PYTHON_CLIENT_MEM_FRACTION=0.9 &&
      unset NCCL_SOCKET_IFNAME &&
      export NCCL_IB_DISABLE=1 &&
      export NCCL_P2P_DISABLE=0 &&
      NS_FILE=assets/pi05_rx2_blackbox_drawer_v2/mondoRX-03_task_0016_20260902_005106_lerobot-f3a05a7f-252a-460a-ac70-c2c2e31ce363/norm_stats.json &&
      ([ -f "$NS_FILE" ] && echo "norm_stats.json present, skipping" || uv run scripts/compute_norm_stats.py --config-name pi05_rx2_blackbox_drawer_v2) &&
      uv run scripts/train.py pi05_rx2_blackbox_drawer_v2
      --exp-name={{ this.name }}
      --checkpoint-base-dir /data/nas_ray/home/siyu.luo/project/openpi-0_5/checkpoints_rx2
      --overwrite
