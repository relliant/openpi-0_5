config_version: 1

# openpi-0.5 full-parameter fine-tune, same dataset as
# pi05_rx2_blackbox_drawer_smallloop_dedup_v1 (300 episodes / 211962 frames) but with
# include_projected_gravity=True — root-caused 2026-09-15 deployment finding
# (/tmp/rx2_vla_deployment_findings_2026-09-15.md): the model was trained with zero
# orientation/gravity feedback despite the raw data having it, leaving it with no explicit
# balance context — persistent forward-lean on hardware. New state = body[:27]
# (drops head_yaw/head_pitch) + projected_gravity(3) + grippers(2) = 32, fits the model's
# hard-capped proprio width (action_dim=32) without touching action_dim, so pi05_base's
# state_proj/action_*_proj weights still load cleanly.
# 8-GPU single-node JAX FSDP → task type `shell`.
#
# Dataset (aliyun-h100 NAS, home dir):
#   /data/nas_ray/home/siyu.luo/data/lerobot/rx2_blackbox_drawer_merged/rx2_drawer_medicine_smallloop_dedup_v1/
# Needs a fresh norm_stats (new state composition) — separate config name means separate
# assets_dirs, no collision with the non-gravity config's norm_stats.

cluster: aliyun_h100
num_gpus: 8
image: ai-base:starvla-cuda12.8_devel-ubuntu22.04-v5

experiment_name: "pi05-rx2-blackbox-drawer-smallloop-gravity-v1"

shared_workspace: /data/nas_ray/home/siyu.luo/project/openpi-0_5
log_folder: "logs"

os_env_vars:
  WANDB_MODE: online

tasks:
  - name: "pi05-rx2-drawer-medicine-smallloop-gravity-v1"
    type: "shell"
    cmd: >
      set -euxo pipefail &&
      cd /data/nas_ray/home/siyu.luo/project/openpi-0_5 &&
      (command -v ffmpeg || (apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg)) &&
      export PATH=$HOME/.local/bin:$PATH &&
      (command -v uv || pip install --user uv) &&
      git config --global url."https://gh-proxy.com/https://github.com/".insteadOf https://github.com/ &&
      export UV_LINK_MODE=copy &&
      GIT_LFS_SKIP_SMUDGE=1 uv sync &&
      GIT_LFS_SKIP_SMUDGE=1 uv pip install -e . &&
      uv pip install gsutil &&
      export WANDB_API_KEY=$(cat /data/nas_ray/home/siyu.luo/.wandb-key) &&
      export HF_LEROBOT_HOME=/data/nas_ray/home/siyu.luo/data/lerobot/rx2_blackbox_drawer_merged &&
      export OPENPI_DATA_HOME=/data/nas_ray/home/siyu.luo/cache/openpi &&
      export XLA_PYTHON_CLIENT_MEM_FRACTION=0.9 &&
      unset NCCL_SOCKET_IFNAME &&
      export NCCL_IB_DISABLE=1 &&
      export NCCL_P2P_DISABLE=0 &&
      NS_FILE=assets/pi05_rx2_blackbox_drawer_smallloop_gravity_v1/rx2_drawer_medicine_smallloop_dedup_v1/norm_stats.json &&
      ([ -f "$NS_FILE" ] && echo "norm_stats.json present, skipping" || uv run scripts/compute_norm_stats.py --config-name pi05_rx2_blackbox_drawer_smallloop_gravity_v1) &&
      uv run scripts/train.py pi05_rx2_blackbox_drawer_smallloop_gravity_v1
      --exp-name={{ this.name }}
      --checkpoint-base-dir /data/nas_ray/home/siyu.luo/project/openpi-0_5/checkpoints_rx2
      --overwrite
